<style>
/* Layout: one playful arcade column on a sky; big question bubble, five chunky book buttons, bookworm mascot cheering. Deliberately single bright theme. */
:root{
  --sky:#bfe6ff; --sky2:#e9f7ff; --card:#ffffff; --ink:#2b2350; --soft:#6d6596;
  --sun:#ffc93c; --pink:#ff7aa8; --mint:#43c59e; --red:#ff5d5d; --violet:#7b61ff;
  --display:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:linear-gradient(var(--sky),var(--sky2) 70%);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.4;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:16px 40px;overflow-x:hidden}
.cloud{position:fixed;background:#fff;border-radius:999px;opacity:.75;z-index:0;pointer-events:none}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.c1{width:150px;height:44px;top:70px;left:-20px}.c1::before{width:70px;height:70px;left:24px;top:-34px}.c1::after{width:50px;height:50px;left:80px;top:-22px}
.c2{width:120px;height:38px;top:200px;right:-10px}.c2::before{width:56px;height:56px;left:18px;top:-28px}.c2::after{width:42px;height:42px;left:64px;top:-18px}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;display:grid;gap:16px}
h1,h2,.display{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance}
button{font:inherit;cursor:pointer;color:var(--ink)}
button:focus-visible{outline:4px solid var(--violet);outline-offset:3px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pill{background:var(--card);border:3px solid var(--ink);border-radius:999px;padding:4px 14px;font-weight:800;display:flex;gap:6px;align-items:center;box-shadow:0 4px 0 var(--ink);font-variant-numeric:tabular-nums}
.pill .n{font-family:var(--display);font-size:24px;color:var(--violet)}
.pill.streak .n{color:#ff8a1f}
.mute{background:var(--card);border:3px solid var(--ink);border-radius:999px;width:46px;height:46px;box-shadow:0 4px 0 var(--ink);font-size:20px}
.progress{height:14px;background:#fff;border:3px solid var(--ink);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--mint) 0 12px,#5ad6b0 12px 24px);transition:width .4s}

/* stage */
.stage{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:end}
.worm{width:110px;height:110px}
.bubble{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:16px 18px;box-shadow:0 6px 0 var(--ink);min-width:0}
.bubble .tag{font-family:var(--display);color:var(--pink);font-size:18px}
.bubble .q{font-size:clamp(19px,3.4vw,24px);font-weight:800}

/* answer grid */
.books{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px}
.book{background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:10px 8px 12px;display:grid;justify-items:center;gap:4px;box-shadow:0 6px 0 var(--ink);transition:transform .12s, box-shadow .12s;text-align:center;min-width:0}
.book svg{width:78px;height:78px}
.book b{font-family:var(--display);font-size:17px;line-height:1.1}
.book:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 9px 0 var(--ink)}
.book:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.book:disabled{cursor:default}
.book.right{background:#d8fbe9;border-color:#13865f;box-shadow:0 6px 0 #13865f}
.book.wrong{background:#ffe0e0;border-color:#c62f2f;box-shadow:0 6px 0 #c62f2f;animation:shake .4s}
.book.dim{opacity:.4}
.authors{display:grid;gap:10px}
.author{background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:12px;font-weight:800;box-shadow:0 5px 0 var(--ink);text-align:left}
.author.right{background:#d8fbe9;border-color:#13865f}
.author.wrong{background:#ffe0e0;border-color:#c62f2f;animation:shake .4s}

/* feedback */
.feedback{border:3px solid var(--ink);border-radius:20px;padding:14px 16px;display:grid;gap:6px;box-shadow:0 6px 0 var(--ink)}
.feedback.ok{background:#d8fbe9}
.feedback.half{background:#fff4cf}
.feedback.no{background:#ffe0e0}
.feedback h2{font-size:28px}
.feedback .ans{font-weight:800}
.feedback .why{color:var(--soft)}
.big{font-family:var(--display);font-size:22px;border:3px solid var(--ink);border-radius:999px;padding:10px 26px;background:var(--sun);box-shadow:0 6px 0 var(--ink);justify-self:start}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.big.alt{background:var(--card)}

/* start / end */
.panel{background:var(--card);border:3px solid var(--ink);border-radius:26px;padding:22px;box-shadow:0 8px 0 var(--ink);display:grid;gap:16px;justify-items:center;text-align:center}
.panel h1{font-size:clamp(34px,8vw,56px);color:var(--violet)}
.panel h1 span{color:var(--pink)}
.panel p{margin:0;color:var(--soft);max-width:34em}
.rowbtn{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.lineup{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.lineup svg{width:56px;height:56px}
.stars{font-size:54px;letter-spacing:6px}
.stars .off{filter:grayscale(1);opacity:.3}
.howto{display:grid;gap:6px;text-align:left;background:var(--sky2);border-radius:16px;padding:12px 16px;font-weight:600}
.missed{text-align:left;display:grid;gap:8px;width:100%}
.missed div{background:var(--sky2);border-radius:14px;padding:10px 12px;font-size:16px}
.missed b{font-family:var(--display)}
.pick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pick button{border:3px solid var(--ink);border-radius:999px;padding:6px 14px;background:#fff;font-weight:800}
.pick button[aria-pressed="true"]{background:var(--mint);color:#fff}

.timebar{height:8px;background:#fff;border:2px solid var(--ink);border-radius:999px;overflow:hidden;margin-top:-8px}
.timebar i{display:block;height:100%;background:var(--sun);transition:width .1s linear}
.pill.clock .n{color:var(--mint)}
.pill.hurry{background:#ffe0e0;animation:pulse .5s infinite alternate}
.pill.hurry .n{color:var(--red)}
.record{background:#fff4cf;border:3px dashed var(--sun);border-radius:16px;padding:8px 14px;font-weight:700}
.newrec{font-family:var(--display);font-size:clamp(26px,6vw,40px);color:#fff;background:linear-gradient(90deg,var(--pink),var(--violet));border:3px solid var(--ink);border-radius:999px;padding:4px 22px;box-shadow:0 6px 0 var(--ink);animation:pop .6s, wiggle 1.2s .6s infinite}
@keyframes pulse{to{transform:scale(1.08)}}
@keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.pop{animation:pop .45s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.worm g.body{animation:bob 2.4s ease-in-out infinite;transform-origin:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){.stage{grid-template-columns:72px 1fr}.worm{width:72px;height:72px}.book svg{width:60px;height:60px}.books{grid-template-columns:repeat(2,1fr)}.book b{font-size:15px}}
</style>
</head>

// ---------- sound ----------
let ac=null, sound=true;
function beep(notes,type){if(!sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();let t=ac.currentTime;
  notes.forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type||"triangle";o.frequency.value=f;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d);t+=d*.8})}catch(e){}}
const SND={yes:()=>beep([[660,.12],[880,.12],[1320,.22]]),half:()=>beep([[660,.14],[784,.2]]),no:()=>beep([[300,.18],[220,.3]]),tap:()=>beep([[520,.06]]),
  tick:()=>beep([[1000,.05]],"square"),
  fanfare:()=>beep([[523,.15],[659,.15],[784,.15],[1047,.3],[784,.12],[1047,.5]])};
// firework sounds: soft whistle going up, low muffled boom, then gentle crackles
let NOISE=null;
function noiseBuf(){if(!NOISE){const n=ac.sampleRate*1.5;NOISE=ac.createBuffer(1,n,ac.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}return NOISE}
function audio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();return ac}catch(e){return null}}
function whistle(){if(!sound||!audio())return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type="sine";o.frequency.setValueAtTime(700,t);o.frequency.exponentialRampToValueAtTime(1500,t+.9);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.025,t+.15);g.gain.linearRampToValueAtTime(0,t+.9);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.95)}
function boom(){if(!sound||!audio())return;const t=ac.currentTime;
  const s=ac.createBufferSource();s.buffer=noiseBuf();const f=ac.createBiquadFilter();f.type="lowpass";
  f.frequency.setValueAtTime(900,t);f.frequency.exponentialRampToValueAtTime(120,t+1);
  const g=ac.createGain();g.gain.setValueAtTime(.22,t);g.gain.exponentialRampToValueAtTime(.001,t+1.1);
  s.connect(f).connect(g).connect(ac.destination);s.start(t,Math.random()*.3);s.stop(t+1.2);
  // crackle: lots of tiny high pops fading out
  for(let k=0;k<14;k++){const at=t+.25+Math.random()*.9,c=ac.createBufferSource(),hp=ac.createBiquadFilter(),cg=ac.createGain();
    c.buffer=noiseBuf();hp.type="highpass";hp.frequency.value=3000;
    cg.gain.setValueAtTime(.05*(1-(at-t)/1.3),at);cg.gain.exponentialRampToValueAtTime(.001,at+.035);
    c.connect(hp).connect(cg).connect(ac.destination);c.start(at,Math.random());c.stop(at+.04)}}

// ---------- confetti + fireworks ----------
const cv=document.getElementById("fx"),cx=cv.getContext("2d");let parts=[],running=false;
const DPR=()=>devicePixelRatio||1;
const COLORS=["#ffc93c","#ff7aa8","#43c59e","#7b61ff","#3aa0e8","#ff8a1f"];
const calm=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
function resize(){cv.width=innerWidth*DPR();cv.height=innerHeight*DPR()}addEventListener("resize",resize);resize();
function run(){if(!running){running=true;requestAnimationFrame(tick)}}
function confetti(){if(calm())return;const d=DPR();
  for(let k=0;k<90;k++)parts.push({k:"c",x:cv.width/2,y:cv.height*.45,vx:(Math.random()-.5)*18*d,vy:(-Math.random()*16-4)*d,r:(Math.random()*6+4)*d,c:COLORS[k%5],a:Math.random()*6,l:90,L:90});
  run()}
function burst(x,y){const d=DPR(),c=COLORS[Math.floor(Math.random()*COLORS.length)],c2=COLORS[Math.floor(Math.random()*COLORS.length)],n=70;
  for(let k=0;k<n;k++){const ang=k/n*Math.PI*2,sp=(Math.random()*4+4)*d;parts.push({k:"f",x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,r:(Math.random()*2+2.2)*d,c:k%3?c:c2,l:70,L:70})}
  run()}
function rocket(){const d=DPR();const x=cv.width*(.15+Math.random()*.7),ty=cv.height*(.12+Math.random()*.3);
  parts.push({k:"r",x,y:cv.height,vx:(Math.random()-.5)*2*d,vy:-(cv.height-ty)/38,ty,r:3*d,c:"#fff3c4",l:60,L:60});
  whistle();run()}
function fireworks(){if(calm())return;for(let k=0;k<9;k++)setTimeout(rocket,k*380+Math.random()*200)}
function tick(){
  cx.globalCompositeOperation="source-over";cx.clearRect(0,0,cv.width,cv.height);const d=DPR();
  const born=[];
  parts.forEach(p=>{
    if(p.k==="c"){p.vy+=.5*d;p.x+=p.vx;p.y+=p.vy;p.a+=.2;p.l--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r,-p.r/2,p.r*1.4,p.r*.7);cx.restore();return}
    if(p.k==="r"){p.x+=p.vx;p.y+=p.vy;p.l--;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill();
      cx.fillStyle="rgba(255,201,60,.5)";cx.beginPath();cx.arc(p.x,p.y+8*d,p.r*.7,0,7);cx.fill();
      if(p.y<=p.ty){p.l=0;born.push([p.x,p.y])}return}
    p.vx*=.96;p.vy=p.vy*.96+.12*d;p.x+=p.vx;p.y+=p.vy;p.l--;
    cx.globalAlpha=Math.max(0,p.l/p.L);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill();cx.globalAlpha=1;
  });
  parts=parts.filter(p=>p.l>0&&p.y<cv.height+40);
  born.forEach(([x,y])=>{burst(x,y);boom()});
  if(parts.length)requestAnimationFrame(tick);else{running=false;cx.clearRect(0,0,cv.width,cv.height)}}

// ---------- storage ----------
function load(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let SEEN=new Set(load("bb-seen",[]));
const recKey=n=>"bb-rec-"+n;
const fmt=s=>{s=Math.round(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};

// ---------- game ----------
const app=document.getElementById("app");
const book=id=>BOOKS.find(b=>b.id===id);
const clean=s=>s.replace(/\s*\(Check this one in the book\.\)/,"");
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
const LIMIT=30; // seconds per question
let G={len:10,on:new Set(BOOKS.map(b=>b.id))},TIMER=null;

function bar(){return `<div class="bar"><div class="pill">⭐ <span class="n">${G.score}</span></div><div class="pill">Q <span class="n">${Math.min(G.i+1,G.deck.length)}/${G.deck.length}</span></div><div class="pill streak">🔥 <span class="n">${G.streak}</span></div><div class="pill clock${G.left<=5&&G.live?" hurry":""}" id="clockpill">⏱ <span class="n" id="clock">${Math.max(0,G.left)}</span></div><button class="mute" id="mute" aria-label="Sound on or off">${sound?"🔊":"🔇"}</button></div><div class="progress"><i style="width:${G.i/G.deck.length*100}%"></i></div><div class="timebar"><i id="timefill" style="width:${Math.max(0,G.left)/LIMIT*100}%"></i></div>`}
function wireMute(){const m=document.getElementById("mute");if(m)m.onclick=()=>{sound=!sound;m.textContent=sound?"🔊":"🔇"}}

// per-question clock: runs from the question appearing until the last answer (or time runs out)
function startClock(){stopClock(false);G.left=LIMIT;G.live=true;G.qStart=performance.now();
  TIMER=setInterval(()=>{const left=LIMIT-(performance.now()-G.qStart)/1000,whole=Math.ceil(left);
    const f=document.getElementById("timefill");if(f)f.style.width=Math.max(0,left)/LIMIT*100+"%";
    if(whole!==G.left){G.left=whole;const c=document.getElementById("clock"),p=document.getElementById("clockpill");
      if(c)c.textContent=Math.max(0,whole);if(p)p.classList.toggle("hurry",whole<=5);if(whole<=5&&whole>0)SND.tick()}
    if(left<=0)timeUp()},100)}
function stopClock(count=true){if(TIMER){clearInterval(TIMER);TIMER=null}
  if(count&&G.live){G.time+=Math.min(LIMIT,(performance.now()-G.qStart)/1000)}G.live=false}
function timeUp(){if(!G.live)return;if(G.phase==="book")pickBook(null);else if(G.phase==="author")pickAuthor(null)}

function recordLine(n){const r=load(recKey(n),null);return r?`🏆 Record for ${n} questions: <b>${r.score} points</b> in <b>${fmt(r.time)}</b>`:`🏆 No record yet for ${n} questions. Set one!`}
function startScreen(){
  stopClock(false);
  app.innerHTML=`<div class="panel">
    ${worm("happy")}
    <h1>Book <span>Battle!</span></h1>
    <p>Read the clue. Tap the book it comes from. Then pick who wrote it. Get both right for 5 points, just like the real battle.</p>
    <div class="lineup">${BOOKS.map(b=>ART[b.id]).join("")}</div>
    <div class="howto"><div>📚 Right book = <b>3 points</b></div><div>✍️ Right author too = <b>+2 more</b></div><div>⏱ You have <b>${LIMIT} seconds</b> for each question</div><div>🏆 Beat your record for fireworks! More points wins. Same points? Faster wins.</div></div>
    <div class="display" style="font-size:20px">How many questions?</div>
    <div class="pick" id="len">${[10,20,30].map(n=>`<button id="len-${n}" aria-pressed="${G.len===n}" data-n="${n}">${n}</button>`).join("")}</div>
    <div class="record">${recordLine(G.len)}</div>
    <div class="display" style="font-size:20px">Which books?</div>
    <div class="pick" id="on">${BOOKS.map(b=>`<button id="on-${b.id}" aria-pressed="${G.on.has(b.id)}" data-b="${b.id}">${b.title}</button>`).join("")}</div>
    <button class="big" id="go">Let's play! ▶</button>
  </div>`;
  app.querySelectorAll("#len button").forEach(b=>b.onclick=()=>{G.len=+b.dataset.n;SND.tap();startScreen()});
  app.querySelectorAll("#on button").forEach(b=>b.onclick=()=>{const id=b.dataset.b;if(G.on.has(id)){if(G.on.size>1)G.on.delete(id)}else G.on.add(id);SND.tap();startScreen()});
  document.getElementById("go").onclick=()=>{SND.tap();newGame()};
}
function newGame(){
  const all=Q.filter(q=>G.on.has(q[0]));
  const fresh=shuffle(all.filter(q=>!SEEN.has(q[1])));
  let deck=fresh.slice(0,G.len);
  if(deck.length<G.len){ // used up every question: start a new cycle, without repeating this game's picks
    all.forEach(q=>SEEN.delete(q[1]));
    deck=deck.concat(shuffle(all.filter(q=>!deck.includes(q))).slice(0,G.len-deck.length));
  }
  deck.forEach(q=>SEEN.add(q[1]));save("bb-seen",[...SEEN]);
  Object.assign(G,{deck,i:0,score:0,streak:0,best:0,missed:[],time:0,left:LIMIT,live:false,phase:null});
  ask();
}
function ask(){
  if(G.i>=G.deck.length)return endScreen();
  const q=G.deck[G.i];G.phase="book";G.left=LIMIT;
  app.innerHTML=`${bar()}
    <div class="stage">${worm("think")}<div class="bubble"><div class="tag">In which book…</div><div class="q">${q[1]}</div></div></div>
    <div class="books" id="books">${BOOKS.map(b=>`<button class="book" id="bk-${b.id}" data-b="${b.id}">${ART[b.id]}<b>${b.title}</b></button>`).join("")}</div>
    <div id="after"></div>`;
  wireMute();
  app.querySelectorAll(".book").forEach(btn=>btn.onclick=()=>pickBook(btn.dataset.b));
  startClock();
}
function pickBook(id){
  if(G.phase!=="book")return;
  const q=G.deck[G.i],right=q[0],bk=book(right),late=id===null;
  app.querySelectorAll(".book").forEach(b=>{b.disabled=true;if(b.dataset.b===right)b.classList.add("right");else if(b.dataset.b===id)b.classList.add("wrong");else b.classList.add("dim")});
  if(id!==right){
    G.phase="done";stopClock();
    SND.no();G.streak=0;G.missed.push(q);
    setWorm("sad");refreshBar();
    document.getElementById("after").innerHTML=`<div class="feedback no pop"><h2>${late?"Time's up! ⏰":OOPS[Math.floor(Math.random()*OOPS.length)]+" ❌"}</h2>
      <div class="ans">The answer is <u>${bk.title}</u> by ${bk.author}.</div><div class="why">${clean(q[2])}</div>
      <button class="big" id="next">Next ▶</button></div>`;
    wireNext();return;
  }
  G.phase="author";
  G.score+=3;SND.half();setWorm("happy");refreshBar();
  const others=shuffle(BOOKS.filter(b=>b.id!==right)).slice(0,2);
  const opts=shuffle([bk,...others]);
  document.getElementById("after").innerHTML=`<div class="feedback half pop"><h2>Right book! +3 📚</h2><div class="ans">Now, who wrote <u>${bk.title}</u>? Hurry, the clock is still going!</div>
    <div class="authors">${opts.map(b=>`<button class="author" id="au-${b.id}" data-b="${b.id}">✍️ ${b.author}</button>`).join("")}</div></div>`;
  app.querySelectorAll(".author").forEach(a=>a.onclick=()=>pickAuthor(a.dataset.b));
}
function pickAuthor(id){
  if(G.phase!=="author")return;
  G.phase="done";stopClock();
  const q=G.deck[G.i],right=q[0],bk=book(right),late=id===null;
  app.querySelectorAll(".author").forEach(a=>{a.disabled=true;if(a.dataset.b===right)a.classList.add("right");else if(a.dataset.b===id)a.classList.add("wrong")});
  const box=document.querySelector(".feedback");
  if(id===right){
    G.score+=2;G.streak++;G.best=Math.max(G.best,G.streak);SND.yes();confetti();
    box.className="feedback ok pop";
    box.innerHTML=`<h2>${CHEERS[Math.floor(Math.random()*CHEERS.length)]} +5 🎉</h2><div class="ans">${bk.title} by ${bk.author}</div><div class="why">${clean(q[2])}</div>${G.streak>=3?`<div class="ans">🔥 ${G.streak} in a row!</div>`:""}<button class="big" id="next">Next ▶</button>`;
  }else{
    G.streak=0;SND.no();setWorm("sad");
    box.className="feedback no pop";
    box.innerHTML=`<h2>${late?"Time's up! ⏰":"Oops, wrong author! ✍️"}</h2><div class="ans">${bk.title} was written by <u>${bk.author}</u>. You still keep your 3 points.</div><div class="why">${clean(q[2])}</div><button class="big" id="next">Next ▶</button>`;
  }
  refreshBar();wireNext();
}
function wireNext(){const n=document.getElementById("next");n.focus({preventScroll:true});n.scrollIntoView({behavior:"smooth",block:"nearest"});n.onclick=()=>{SND.tap();G.i++;ask();scrollTo({top:0,behavior:"smooth"})}}
function setWorm(m){const w=app.querySelector(".worm");if(w)w.outerHTML=worm(m)}
function refreshBar(){const tmp=document.createElement("div");tmp.innerHTML=bar();
  [".bar",".progress",".timebar"].forEach((sel,k)=>{const old=app.querySelector(sel);if(old)old.replaceWith(tmp.querySelector(sel))});wireMute()}
function endScreen(){
  stopClock(false);
  const n=G.deck.length,max=n*5,pct=G.score/max,stars=pct>=.85?3:pct>=.6?2:pct>=.3?1:0;
  const old=load(recKey(n),null);
  const isRec=!old||G.score>old.score||(G.score===old.score&&G.time<old.time);
  if(isRec)save(recKey(n),{score:G.score,time:G.time,date:new Date().toISOString().slice(0,10)});
  const msg=["Keep reading, you'll get there!","Good start! Read a little more and try again.","Great job, book battler!","WOW! You're a Battle of the Books champion!"][stars];
  app.innerHTML=`<div class="panel">${worm(stars>=1||isRec?"happy":"sad")}
    ${isRec?`<div class="newrec">🏆 NEW RECORD! 🏆</div>`:""}
    <h1>${isRec?"You beat it!":stars>=2?"Hooray!":"Nice work!"}</h1>
    <div class="stars">${[0,1,2].map(k=>`<span class="${k<stars?"":"off"}">⭐</span>`).join("")}</div>
    <div class="display" style="font-size:32px">${G.score} / ${max} points</div>
    <div class="display" style="font-size:24px">⏱ ${fmt(G.time)}</div>
    <p>${msg} Best streak: 🔥 ${G.best}</p>
    <div class="record">${old?(isRec?`Old record: ${old.score} points in ${fmt(old.time)}`:`🏆 Record to beat: <b>${old.score} points</b> in <b>${fmt(old.time)}</b>`):"This is your first record!"}</div>
    ${G.missed.length?`<div class="display" style="font-size:20px">Books to look at again</div><div class="missed">${G.missed.map(q=>`<div>In which book ${q[1]}<br><b>${book(q[0]).title}</b> by ${book(q[0]).author}</div>`).join("")}</div>`:`<p>No misses at all! 🏆</p>`}
    <div class="rowbtn"><button class="big" id="again">Play again ▶</button><button class="big alt" id="home">Change settings</button></div></div>`;
  if(isRec){SND.fanfare();fireworks();setTimeout(fireworks,3800)}else if(stars>=2)confetti();
  document.getElementById("again").onclick=()=>{SND.tap();newGame()};
  document.getElementById("home").onclick=()=>{SND.tap();startScreen()};
}
startScreen();
</script>

</body>
